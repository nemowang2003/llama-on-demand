repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        language: system
        entry: uv lock --check
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff-check
        name: ruff-check
        language: system
        entry: uv run --locked ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff-format
        language: system
        entry: uv run --locked ruff format
        types: [python]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.88
    hooks:
      - id: ty
        args: [--locked]
