repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        language: system
        entry: uv lock --check
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff-check
        name: ruff-check
        language: system
        entry: uv run --locked ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff-format
        language: system
        entry: uv run --locked ruff format
        types: [python]
      - id: ty
        name: ty
        language: system
        entry: uv run --locked --extra proxy ty check
        types: [python]
        pass_filenames: false
